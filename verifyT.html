<!doctype html>
<html><head><meta charset="utf-8"/>

const ico=(d,s=15,c=GOLD,sw=1.7,f='none')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="display:block"><path d="${d}" fill="${f}" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const badge=(d,s=28,glyph=GOLD)=>`<span style="width:${s}px;height:${s}px;border-radius:50%;border:1.5px solid ${GOLD};background:#fff;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0">${ico(d,Math.round(s*0.52),glyph)}</span>`;
const row=(d,l,v,vc,last)=>`<div style="display:flex;align-items:center;gap:11px;padding:5px 2px;border-bottom:${last?'none':'1px dotted '+DOT_LINE}">${badge(d,28)}<div style="width:120px;font-size:12px;font-weight:700;color:${INK_TX}">${l}</div><div style="color:#B9A77E;font-weight:700">:</div><div style="flex:1;font-size:12px;color:${vc||'#2C2113'};font-weight:600">${v||'—'}</div></div>`;
const ribbon=(d,t)=>`<div style="display:flex;align-items:center;gap:10px;background:${BROWN};border-radius:8px 8px 0 0;padding:7px 13px"><span style="width:28px;height:28px;border-radius:50%;border:2px solid ${GOLD};background:${BROWN_LT};display:inline-flex;align-items:center;justify-content:center">${ico(d,14,GOLD)}</span><span style="font-size:12.5px;font-weight:800;color:#fff;letter-spacing:1.1px">${t}</span></div>`;
const flo=(flip)=>`<svg width="84" height="13" viewBox="0 0 92 14" style="display:block;transform:${flip?'scaleX(-1)':'none'}"><path d="M2 7h44c8 0 8-5 16-5" fill="none" stroke="${GOLD}" stroke-width="1.4" stroke-linecap="round"/><path d="M62 2c6 0 6 10 12 10s6-8 14-5" fill="none" stroke="${GOLD}" stroke-width="1.4" stroke-linecap="round"/><circle cx="90" cy="7" r="2" fill="${GOLD}"/></svg>`;
const cardEl=(ic,title,rows)=>`<div style="flex:1;display:flex;flex-direction:column">${ribbon(ic,title)}<div style="flex:1;border:1px solid ${DOT_LINE};border-top:none;border-radius:0 0 10px 10px;background:${CREAM_BG};padding:2px 15px">${rows}</div></div>`;
const fmtDate=(s)=>{if(!s)return{main:'',wd:''};const d=new Date(s);if(isNaN(d.getTime()))return{main:String(s),wd:''};const day=String(d.getDate()).padStart(2,'0');const mon=d.toLocaleDateString('en-US',{month:'short'});const wd=d.toLocaleDateString('en-US',{weekday:'short'});return{main:`${day} ${mon} ${d.getFullYear()}`,wd:`(${wd})`};};
const fmt2=(n)=>Number(n||0).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});const tdC=`border-top:1px solid ${DOT_LINE};padding:7px 6px;font-size:11.5px;text-align:center;color:#3A2F1C;vertical-align:middle`;
const logo='public/IMG_6483.PNG';
// Brand mark: cropped emblem + wordmark
const mark=`<div style="display:flex;align-items:center;gap:13px;padding-top:24px;padding-left:74px">
  <div style="position:relative;width:86px;height:86px;overflow:hidden;flex-shrink:0"><img src="${logo}" width="154" height="154" style="position:absolute;left:-33px;top:-4px"/></div>
  <div><div style="font-family:${serif};font-size:28px;font-weight:700;color:${GOLD};letter-spacing:1px;line-height:1">SAFAR E ARABIAN</div>
  <div style="display:flex;align-items:center;gap:8px;margin-top:5px;width:218px"><span style="width:20px;height:1.5px;background:${GOLD}"></span><span style="font-size:10px;letter-spacing:4px;color:${GOLD_DK};font-weight:600">TRAVEL &amp; TOURS</span><span style="flex:1;height:1.5px;background:${GOLD}"></span></div></div>
</div>`;

const inv={invoice_no:280,guest_name:'ZAHID ALI',nationality:'Pakistan',contact_number:'8898655622',payment_type:'SR CASH',agent_name:'MRN TRV',agent_no:'MC0060',reservation_date:'2026-03-28',username:'MUHAMMAD AYAN',transport:0,discount:0,vat:0,net_total_with_tax:400,convert_rate_total_sar:77,account_name:'Safar E Arabian Travel & Tours',bank:'Faisal Bank',bank_account_no:'3054301000007374',ibn:'PK65FAYS3054301000007374',bank_address:'',cancellation_policy:'No-Cancellation or Amendment will be accepted after re-confirmation',no_show_policy:'In-case of No-Show full transport amount will be charged'};
const segs=[{date:'2026-04-02',time:'22:00:00',from_location:'JEDDAH AIRPORT',to_location:'MAKKAH HOTEL',vehicle:'H1',mov_type:'',qty:1,rate:400,total:400}];
const netBase=400,vatAmt=0;const phone='+92 305 1309051';const email='info@safararabiantravel.com';const website='safararabiantravel.com';

const cols=[['DATE',G.calendar],['TIME',G.clock],['FROM',G.pin],['TO',G.pin],['VEHICLE',G.car],['MOV TYPE',G.route],['QTY',G.hash],['RATE',G.tag],['TOTAL',G.money]];
const head=cols.map((c,ci)=>`<th style="padding:6px 5px;border-right:${ci<cols.length-1?'1px solid rgba(255,255,255,0.12)':'none'};color:#fff"><div style="display:flex;flex-direction:column;align-items:center;gap:3px">${ico(c[1],15,GOLD_LT)}<span style="font-size:9px;font-weight:700;letter-spacing:.3px">${c[0]}</span></div></th>`).join('');
const body=segs.map((s,i)=>{const d=fmtDate(s.date);return `<tr style="background:${i%2?'#FBF5E8':'#fff'}"><td style="${tdC}"><div>${d.main}</div><div style="font-size:9.5px;color:#8A7A55">${d.wd}</div></td><td style="${tdC}">${s.time}</td><td style="${tdC}">${s.from_location}</td><td style="${tdC}">${s.to_location}</td><td style="${tdC}">${s.vehicle}</td><td style="${tdC}">${s.mov_type||''}</td><td style="${tdC}">${s.qty}</td><td style="${tdC}">${fmt2(s.rate)}</td><td style="${tdC};font-weight:700;color:${BROWN};font-size:12px">${fmt2(s.total)}</td></tr>`}).join('');
const bank=[[G.bank,'Account Name',inv.account_name],[G.bank,'Bank',inv.bank],[G.card,'Bank Account No',inv.bank_account_no],[G.iban,'IBAN',inv.ibn],[G.pin,'Bank Address',inv.bank_address]].map(b=>`<div style="display:flex;align-items:flex-start;gap:11px;margin-bottom:6px">${badge(b[0],28)}<div style="width:112px;font-size:12px;font-weight:700;color:${INK_TX};padding-top:5px">${b[1]}</div><div style="color:#B9A77E;font-weight:700;padding-top:5px">:</div><div style="flex:1;font-size:12px;color:#2C2113;padding-top:5px">${b[2]||'—'}</div></div>`).join('');
const sumLines=[['Transport',fmt2(inv.transport)],['Discount',fmt2(inv.discount)],['Net Total',fmt2(netBase)],[`VAT (${inv.vat.toFixed(2)}%)`,fmt2(vatAmt)],['Convert Rate Total: SAR',fmt2(inv.convert_rate_total_sar)]].map((l,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:${i?'1px dotted '+DOT_LINE:'none'}"><span style="font-size:12.5px;color:${INK_TX}">${l[0]}</span><span style="font-size:12.5px;font-weight:600;color:${INK_TX}">${l[1]}</span></div>`).join('');

document.getElementById('stage').innerHTML=`<div id="doc" style="width:794px;background:#fff;position:relative;overflow:hidden;box-sizing:border-box;font-family:Arial;color:${INK_TX}">
<div style="position:absolute;top:0;left:0;width:100px;height:88px;z-index:0"><svg width="100" height="88" viewBox="0 0 100 88"><path d="M100 0 A100 88 0 0 1 0 88 L0 76 A88 76 0 0 0 88 0 Z" fill="${GOLD}"/><path d="M84 0 A84 73 0 0 1 0 73 L0 50 A62 50 0 0 0 62 0 Z" fill="${BROWN}"/><path d="M48 0 A48 42 0 0 1 0 42 L0 36 A42 36 0 0 0 42 0 Z" fill="${GOLD_LT}"/></svg></div>
<div style="position:relative;z-index:1;padding:20px 30px 16px">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
    ${mark}
    <div style="text-align:right;min-width:296px">
      <div style="font-family:${serif};font-size:32px;font-weight:700;color:${INK_TX};letter-spacing:3px;line-height:1;margin-bottom:8px">INVOICE</div>
      <div style="display:flex;justify-content:flex-end;margin-bottom:8px"><div style="display:flex;border-radius:6px;overflow:hidden;border:1px solid ${GOLD}"><div style="background:${BROWN};color:#fff;padding:6px 14px;text-align:center"><div style="font-size:9.5px;letter-spacing:1.2px">RESERVATION NO.</div><div style="font-size:15px;font-weight:700;color:${GOLD_LT};margin-top:2px">T-${inv.invoice_no}</div></div><div style="background-color:${GOLD};background-image:linear-gradient(to bottom,${GOLD_LT},${GOLD});color:${BROWN};padding:6px 14px;text-align:center"><div style="font-size:9.5px;letter-spacing:1.2px">INVOICE DATE</div><div style="font-size:15px;font-weight:700;margin-top:2px">${fmtDate(new Date()).main}</div></div></div></div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:11px;color:${INK_TX}"><div style="display:flex;align-items:center;gap:8px"><span>${phone}</span>${badge(G.phone,21)}</div><div style="display:flex;align-items:center;gap:8px"><span>${email}</span>${badge(G.mail,21)}</div><div style="display:flex;align-items:center;gap:8px"><span>${website}</span>${badge(G.globe,21)}</div></div>
    </div>
  </div>
  <div style="height:1.5px;background:${GOLD};opacity:.5;margin:4px 0 10px"></div>
  <div style="display:flex;gap:20px;align-items:stretch">
    ${cardEl(G.user,'GUEST INFORMATION',row(G.user,'Guest Name',inv.guest_name)+row(G.globe,'Nationality',inv.nationality)+row(G.phone,'Mobile No',inv.contact_number)+row(G.tag,'Payment Type',inv.payment_type,null,true))}
    ${cardEl(G.calendar,'BOOKING INFORMATION',row(G.user,'Agent Name',inv.agent_name)+row(G.badge,'Agent No',inv.agent_no)+row(G.calendar,'Reservation Date',inv.reservation_date)+row(G.hash,'User Id',inv.username,null,true))}
  </div>
  <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0 8px">${flo(true)}${badge(G.car,28)}<span style="font-family:${serif};font-size:17px;font-weight:700;color:${BROWN};letter-spacing:1.2px;text-transform:uppercase">Transport Details</span>${flo(false)}</div>
  <div style="border-radius:10px;overflow:hidden;border:1px solid ${GOLD}"><table style="width:100%;border-collapse:collapse"><thead><tr style="background:${BROWN}">${head}</tr></thead><tbody>${body}</tbody></table></div>
  <div style="display:flex;gap:24px;margin-top:14px;align-items:flex-start">
    <div style="flex:1.1;padding-top:2px">${bank}</div>
    <div style="width:330px;flex-shrink:0">${ribbon(G.receipt,'PAYMENT SUMMARY')}<div style="border:1px solid ${DOT_LINE};border-top:none;background:${CREAM_BG};padding:7px 16px 0">${sumLines}</div><div style="background-color:${GOLD};background-image:linear-gradient(to bottom,${GOLD_LT},${GOLD});border-radius:0 0 10px 10px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center"><span style="font-family:${serif};font-size:18px;font-weight:700;color:${BROWN}">NET TOTAL</span><span style="font-size:12px;color:${BROWN}">SAR <strong style="font-size:21px">${fmt2(inv.net_total_with_tax)}</strong></span></div></div>
  </div>
  <div style="margin-top:10px"><p style="color:#B23B2E;font-size:10.5px;margin:0 0 2px"><strong>Cancellation Policy :</strong> ${inv.cancellation_policy}</p><p style="color:#B23B2E;font-size:10.5px;margin:0"><strong>No Show Policy :</strong> ${inv.no_show_policy}</p></div>
  <div style="display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px">${flo(true)}${ico('M12 2l4 5-4 5-4-5z',13,GOLD,1.7,GOLD)}${flo(false)}</div>
  <div style="text-align:center;margin-top:6px;font-size:11px;color:#6B5C3E"><strong style="color:${BROWN}">Generated by:</strong> ${inv.agent_name}  ·  Agent No: ${inv.agent_no}</div>
  <div style="text-align:center;margin-top:2px;font-size:10.5px;font-style:italic;color:#9B8A6A">Thank you for choosing Safar e Arabian</div>
</div></div>`;
window.addEventListener('load',()=>{setTimeout(()=>{const el=document.getElementById('doc');html2canvas(el,{scale:2,useCORS:true,allowTaint:true,backgroundColor:'#fff',logging:false}).then(c=>{const a4=(c.width*1.4142).toFixed(0);c.style.width='794px';document.getElementById('out').appendChild(c);document.getElementById('stage').style.display='none';document.title='H'+c.height+' A4'+a4+(c.height<=a4?' FIT':' OVER');});},500);});
</script></body></html>
