name: Deploy to production

# Auto-deploys every push to master, and gives a manual "Run workflow"
# button in the Actions tab (workflow_dispatch).
on:
  push:
    branches: [master]
    # Skip redeploys for doc-only changes.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# Never let two deploys run at once; let an in-flight one finish.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Redeploy on server (76.13.17.93)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (provides the deploy script)
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Redeploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' < .github/deploy/remote-deploy.sh
